help = """
🎵 Commands  (prefix: {prefix})

Playback
{prefix} help (h) - show this help
{prefix} lang [code] - show or set this room's language
{prefix} join (j) - join Element Call in this room
{prefix} leave (lv) - leave current Element Call
{prefix} play (p) <url-or-query> - add track and auto-join call if needed
{prefix} playnext (pn) <url-or-query> - add track to the front of the queue
{prefix} search (sr) <query> - show {results} results; then {prefix} play <n> / {prefix} playnext <n>
{prefix} queue (q) - show queue with ETA
{prefix} remove (rm) <n> - remove track n of the queue
{prefix} nowplaying (np) - show current track
{prefix} skip (s) - skip current track
{prefix} pause (ps) - pause; again to resume
{prefix} resume (rs) - resume after pause
{prefix} stop (x) - stop playback and clear queue
{prefix} loop (lp) - toggle loop mode
{prefix} shuffle (sh, random) - shuffle the upcoming tracks
{prefix} history (hist) - show recent playback history

Saved Queues
{prefix} save (sv) <name> [--force] - save current+upcoming queue
{prefix} load (ld) <name> - load a saved queue and auto-join call if needed
{prefix} queues (qs) - list saved queues
{prefix} deletequeue (dq) <name> - delete a saved queue
{prefix} renamequeue (rq) <old> <new> - rename a saved queue

Audio & Info
{prefix} audio (a) - show current audio settings
{prefix} normalize (norm) on|off - toggle normalization
{prefix} fadein (fi) <ms> - set fade-in (0-5000)
{prefix} volume (v) <0-200> - set volume (logarithmic: 50 = about half as loud)
{prefix} status (st) - show bot status
{prefix} diag (d) - show diagnostics
{prefix} config (cfg) - show active config
{prefix} defaults (df) - show default config values"""
