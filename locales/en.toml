# locales/<code>.toml (shipped), set language_name and change the texts.
# Keep every {placeholder}; leave out keys you don't translate (English is
# used for them). Plural forms: { one = "...", other = "..." } (Russian:
# one / few / many). Keep a leading ❌ or ⚠️: it marks the message as urgent.
