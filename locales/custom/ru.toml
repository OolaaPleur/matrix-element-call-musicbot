# Ваши правки русских сообщений бота. Этот файл накладывается поверх
# locales/ru.toml: действует только то, что раскомментировано.
#
# Чтобы поменять сообщение: уберите "# " в начале его строки (у многострочных,
# как help, во всех строках) и поправьте текст. Подстановки в {скобках}
# оставляйте как есть, лишние можно убрать. ❌/⚠️ в начале строки помечают
# сообщение как срочное. Применяется после перезапуска бота.
#
# Новый язык: файл locales/custom/<код>.toml со своим language_name и ключами
# из locales/en.toml; бот покажет его в "!m lang".

