# help = """
# 🎵 Команды  (префикс: {prefix})
#
# Воспроизведение
# {prefix} help (h) — эта справка
# {prefix} lang [код] — язык бота в этой комнате
# {prefix} join (j) — подключиться к звонку в этой комнате
# {prefix} leave (lv) — выйти из звонка
# {prefix} play (p) <ссылка или запрос> — добавить трек (бот сам зайдёт в звонок)
# {prefix} playnext (pn) <ссылка или запрос> — добавить трек следующим
# {prefix} search (sr) <запрос> — показать {results} результатов; потом {prefix} play <n> / {prefix} playnext <n>
# {prefix} queue (q) — очередь и когда начнётся каждый трек
# {prefix} remove (rm) <n> — убрать трек n из очереди
# {prefix} nowplaying (np) — что играет сейчас
# {prefix} skip (s) — следующий трек
# {prefix} pause (ps) — пауза; ещё раз — продолжить
# {prefix} resume (rs) — продолжить после паузы
# {prefix} stop (x) — остановить и очистить очередь
# {prefix} loop (lp) — повтор текущего трека вкл/выкл
# {prefix} shuffle (sh, random) — перемешать следующие треки
# {prefix} history (hist) — что играло недавно
#
# Сохранённые очереди
# {prefix} save (sv) <имя> [--force] — сохранить текущий трек и очередь
# {prefix} load (ld) <имя> — загрузить сохранённую очередь (бот сам зайдёт в звонок)
# {prefix} queues (qs) — список сохранённых очередей
# {prefix} deletequeue (dq) <имя> — удалить сохранённую очередь
# {prefix} renamequeue (rq) <старое> <новое> — переименовать
#
# Звук и информация
# {prefix} audio (a) — настройки звука
# {prefix} normalize (norm) on|off — выравнивание громкости
# {prefix} fadein (fi) <мс> — плавное нарастание в начале трека (0–5000)
# {prefix} volume (v) <0-200> — громкость (логарифмическая: 50 ≈ вдвое тише)
# {prefix} status (st) — состояние бота
# {prefix} diag (d) — диагностика
# {prefix} config (cfg) — действующие настройки
# {prefix} defaults (df) — значения по умолчанию"""
