# Copy to config/config.toml

# ==============================
# HARD REQUIREMENT TO RUN
# ==============================
[matrix]
# Filled in by: python3 scripts/get_access_token.py
homeserver = "https://matrix.example.org"
user_id = "@musicbot:example.org"
access_token = "YOUR_MATRIX_ACCESS_TOKEN"


# ==============================
# OPTIONAL SETTINGS
# ==============================
[bot]
name = "Music Bot"
command_prefix = "!m"    # prefix for all bot commands (e.g. "!m play")
language = "en"          # default language of chat messages (locales/*.toml, locales/custom/*.toml); "!m lang" sets it per room
history_limit = 10
auto_accept_invites = false
# auto_accept_invites_from = ["@youruser:matrix.org"]  # if set, only accept invites from these users (overrides auto_accept_invites)
# Send track_started/track_finished room events for the companion scrobbler bot.
# Leave off without it: two extra sends per track use up the homeserver's rate
# limit and slow down command replies after a few quick skips.
scrobbler_events = false

[paths]
# Downloaded tracks. Relative paths are relative to the bot directory
# (avoid /tmp: on many systems it is in RAM and emptied on reboot).
audio_dir = "cache/audio"
saved_queues_file = "data/saved_queues.json"

[audio]
# Cache modes:
# - always_delete: no persistent cache, files removed after playback/on shutdown
# - never_delete: keep all downloaded files
# - size_lru: keep cache up to cache_max_bytes, evict oldest when over limit
cache_mode = "size_lru" # always_delete | never_delete | size_lru
cache_max_bytes = 1073741824 # 1GB default, minimum 200MB in size_lru
cache_delete_after_playback = false
cache_delete_on_shutdown = true
search_mode = "fast" # fast | accurate
search_timeout_seconds = 8.0
extractor_retries = 1
download_format = "opus" # opus | wav | mp3 | ogg(vorbis) | m4a; opus is what YouTube serves: stored without re-encoding, smallest files
audio_quality = "best" # best | medium | worst
# ytdlp_cookies_file = "/path/to/cookies.txt"  # optional: pass cookies to yt-dlp for age-restricted/bot-gated content
stream_first_idle = true
stream_prefetch_current = true
stream_retry_to_file_on_fail = true

auto_advance_buffer = 2.0
preroll_silence = 0.0 # seconds of silence added before each track; anything above 0 re-encodes the file
normalize_audio = false
fade_in_ms = 120
volume_percent = 100 # 0-200
proxy = "" # leave empty to use system proxy (same as "yt-dlp --proxy $PROXY" if not empty)

[worker]
max_restart_attempts = 3
heartbeat_interval_seconds = 10.0
skip_cooldown_seconds = 1.0
stop_timeout_restart_threshold = 2
membership_mode = "legacy" # legacy | matrix2_auto | matrix2
stereo = true # false = mono (voice-style)
audio_bitrate_kbps = 128 # Opus max bitrate; 0 = LiveKit's default
# Encrypt call audio (LiveKit media E2EE, as Element Call does). Needs the worker
# device (scripts/create_worker_device.py) and the rtc-node patch
# (call_worker/patches/apply-pr768.py).
#   auto:  on once the worker device exists, silently off before that
#   true:  on; if it can't be, the bot says so in the room and plays unencrypted
#   false: off, even with a worker device
e2ee = "auto"
log_max_bytes = 2000000
log_backups = 5

[playlist]
max_tracks_per_request = 50
background_load_concurrency = 4

[logging]
file = "logs/musicbot.log"
clean_enabled = true
clean_file = "logs/musicbot.clean.log"
clean_filter_matrixrtc_noise = true
max_bytes = 2000000
backups = 5

[ui]
show_progress_messages = false
rich_formatting = false
quiet_mode = true
