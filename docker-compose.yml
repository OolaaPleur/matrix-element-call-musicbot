services:
  musicbot:
    # The image CI publishes for every push to main. To build from this
    # checkout instead (e.g. with your own changes), uncomment `build` and run
    # `docker compose up -d --build`.
    image: ghcr.io/oolaapleur/matrix-element-call-musicbot:latest
    # build: .
    container_name: musicbot
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/app/config/config.toml
    volumes:
      - ./config:/app/config:ro
      - musicbot_logs:/app/logs
      - musicbot_data:/app/data
      - musicbot_cache:/tmp/musicbot_audio

volumes:
  musicbot_logs:
  musicbot_data:
  musicbot_cache:
