services:
  musicbot:
    # Built from this checkout (`docker compose up -d --build`). To use the
    # image CI publishes instead, drop `build` and run `docker compose pull`.
    build: .
    image: ghcr.io/oolaapleur/matrix-element-call-musicbot:latest
    container_name: musicbot
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/app/config/config.toml
    volumes:
      - ./config:/app/config:ro
      - musicbot_logs:/app/logs
      - musicbot_data:/app/data
      - musicbot_cache:/tmp/musicbot_audio

volumes:
  musicbot_logs:
  musicbot_data:
  musicbot_cache:
